<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Research and engineering portfolio map</title>
  <desc id="desc">A dark visual map connecting quantitative research questions with selected research projects and systems engineering evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#0b1726"/>
      <stop offset="1" stop-color="#112532"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2e8dcc" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2e8dcc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4aa997" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4aa997" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9eb4c5" stroke-width="0.55" opacity="0.065"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)"/>
  <circle cx="1000" cy="95" r="210" fill="url(#blueGlow)"/>
  <circle cx="300" cy="450" r="230" fill="url(#tealGlow)"/>

  <text x="54" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#edf4fa">Research ↔ Engineering Portfolio</text>
  <text x="54" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#91a6b7">Market data, robust evaluation, and performance-oriented systems form one technical profile.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="56" y="126" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6bd6c1">RESEARCH QUESTIONS</text>
    <text x="474" y="126" font-size="11" font-weight="700" letter-spacing="1.4" fill="#68b7ff">RESEARCH ARTIFACTS</text>
    <text x="894" y="126" font-size="11" font-weight="700" letter-spacing="1.4" fill="#d2a563">SYSTEMS EVIDENCE</text>

    <g>
      <rect x="54" y="150" width="300" height="86" rx="14" fill="#0f292c" stroke="#315e58"/>
      <text x="76" y="180" font-size="15" font-weight="700" fill="#dff5ef">Market microstructure</text>
      <text x="76" y="203" font-size="12" fill="#93ada7">Level-2 events · execution topology</text>
      <text x="76" y="220" font-size="12" fill="#93ada7">price paths · quote response</text>
    </g>
    <g>
      <rect x="54" y="258" width="300" height="86" rx="14" fill="#10253a" stroke="#315b7d"/>
      <text x="76" y="288" font-size="15" font-weight="700" fill="#e6f2fb">Financial ML &amp; evaluation</text>
      <text x="76" y="311" font-size="12" fill="#9bb0c1">point-in-time alignment · leakage audits</text>
      <text x="76" y="328" font-size="12" fill="#9bb0c1">walk-forward / OOT · model risk</text>
    </g>
    <g>
      <rect x="54" y="366" width="300" height="86" rx="14" fill="#2a2117" stroke="#6d593c"/>
      <text x="76" y="396" font-size="15" font-weight="700" fill="#f4ecdf">Reliable forecasting</text>
      <text x="76" y="419" font-size="12" fill="#baa992">evidence aggregation · calibration</text>
      <text x="76" y="436" font-size="12" fill="#baa992">temporal provenance · uncertainty</text>
    </g>

    <g>
      <rect x="454" y="144" width="330" height="92" rx="14" fill="#0c1827" stroke="#35516b"/>
      <text x="476" y="174" font-size="16" font-weight="700" fill="#f0f5fa">LENS / current Level-2 research</text>
      <text x="476" y="197" font-size="12" fill="#91a6b7">financial sequence infrastructure,</text>
      <text x="476" y="214" font-size="12" fill="#91a6b7">market-wide microstructure analysis</text>
    </g>
    <g>
      <rect x="454" y="260" width="330" height="92" rx="14" fill="#0c1827" stroke="#35516b"/>
      <text x="476" y="290" font-size="16" font-weight="700" fill="#f0f5fa">SPY VaR</text>
      <text x="476" y="313" font-size="12" fill="#91a6b7">development → freeze → final OOS,</text>
      <text x="476" y="330" font-size="12" fill="#91a6b7">classical vs small neural models</text>
    </g>
    <g>
      <rect x="454" y="376" width="330" height="92" rx="14" fill="#0c1827" stroke="#35516b"/>
      <text x="476" y="406" font-size="16" font-weight="700" fill="#f0f5fa">Reliable Multi-Agent FYP</text>
      <text x="476" y="429" font-size="12" fill="#91a6b7">evidence aggregation, verification,</text>
      <text x="476" y="446" font-size="12" fill="#91a6b7">calibration &amp; point-in-time provenance</text>
    </g>

    <g>
      <rect x="864" y="150" width="282" height="86" rx="14" fill="#181a20" stroke="#5d5143"/>
      <text x="886" y="180" font-size="15" font-weight="700" fill="#f1e8da">C++ / Rust replay</text>
      <text x="886" y="203" font-size="12" fill="#b6aa9a">deterministic state · Python oracle</text>
      <text x="886" y="220" font-size="12" fill="#b6aa9a">sanitizers · conformance · benchmarks</text>
    </g>
    <g>
      <rect x="864" y="258" width="282" height="86" rx="14" fill="#181a20" stroke="#5d5143"/>
      <text x="886" y="288" font-size="15" font-weight="700" fill="#f1e8da">ASC / HPC</text>
      <text x="886" y="311" font-size="12" fill="#b6aa9a">CUDA · TensorRT · MPI · Slurm</text>
      <text x="886" y="328" font-size="12" fill="#b6aa9a">profiling · NUMA/cache locality</text>
    </g>
    <g>
      <rect x="864" y="366" width="282" height="86" rx="14" fill="#181a20" stroke="#5d5143"/>
      <text x="886" y="396" font-size="15" font-weight="700" fill="#f1e8da">Data pipelines</text>
      <text x="886" y="419" font-size="12" fill="#b6aa9a">memory mapping · parallel I/O</text>
      <text x="886" y="436" font-size="12" fill="#b6aa9a">model-ready batches · reproducibility</text>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="2">
    <path d="M354 193 C398 193 410 190 454 190" stroke="#5da997"/>
    <path d="M354 301 C398 301 410 306 454 306" stroke="#5c9fd0"/>
    <path d="M354 409 C398 409 410 422 454 422" stroke="#b78b56"/>
    <path d="M784 190 C824 190 830 193 864 193" stroke="#63798a" stroke-dasharray="5 6"/>
    <path d="M784 306 C824 306 830 301 864 301" stroke="#63798a" stroke-dasharray="5 6"/>
    <path d="M784 422 C824 422 830 409 864 409" stroke="#63798a" stroke-dasharray="5 6"/>
  </g>
</svg>