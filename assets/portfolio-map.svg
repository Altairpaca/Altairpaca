<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Research to systems portfolio map</title>
  <desc id="desc">A visual map connecting research questions with selected projects and upstream engineering work.</desc>
  <rect width="1200" height="520" rx="24" fill="#fbfaf6"/>
  <text x="54" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#17212c">Research ↔ Systems Portfolio</text>
  <text x="54" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#6b7480">One research identity, expressed through models, decision systems, and upstream engineering.</text>

